name: Supabase Anti-Pause Keep-Alive

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (3:00 AM ARG)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Rest API
        env:
          # La URL y la anon key son públicas (ya viajan en el frontend). El secret, si existe, tiene prioridad.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://eckgwyvbevlpnhjrsaxy.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVja2d3eXZiZXZscG5oanJzYXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzM1ODgsImV4cCI6MjEwNjIwOTU4OH0.MfgjL7yQPidqir2ybVEpcfeAsrioZGIIvgVv_bMyI7I' }}
        run: |
          echo "Ejecutando Heartbeat contra Supabase para prevenir pausa por inactividad..."
          STATUS=$(curl -s -o /tmp/keepalive.json -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/supabase_keep_alive?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $STATUS"
          cat /tmp/keepalive.json
          echo

          if [ "$STATUS" = "200" ]; then
            echo "Heartbeat exitoso: Supabase responde."
          else
            echo "::error::Supabase respondió HTTP $STATUS en el heartbeat. Revisar la base o la clave."
            exit 1
          fi
