<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PsiEstudio — React & Tailwind Academic Suite</title>
  <meta name="description" content="Plataforma académica integral en React y Tailwind: materias, bibliografía, clases, apuntes, PDFs y Supabase.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FBF8F3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PsiEstudio">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  
  <!-- Central Color Palette -->
  <link rel="stylesheet" href="colors.css">

  <!-- Estilos de la app: Tailwind compilado en tailwind.css (sin CDN externo) -->
  <link rel="stylesheet" href="tailwind.css">

  <!-- KaTeX & Mermaid for rich academic notes -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
    }
  </script>
  <!-- DOMPurify for XSS defense -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <!-- React 18 + ReactDOM + Babel Standalone + Lucide Icons + Supabase + PDF.js + jsPDF + PDF-Lib + Dexie -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      // Sin esto, PDF.js corre en el hilo principal: en el celular se traba al abrir un PDF.
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
</head>
<body class="bg-app-base text-app-text min-h-dvh antialiased transition-colors duration-300">
  <div id="root"></div>

  <!-- React App Root con Cache Buster -->
  <script type="text/babel" src="app.jsx?v=2.37.0"></script>
</body>
</html>
