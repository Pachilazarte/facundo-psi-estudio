<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>PsiEstudio — React & Tailwind Academic Suite</title>
  <meta name="description" content="Plataforma académica integral en React y Tailwind: materias, bibliografía, clases, apuntes, PDFs y Supabase.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FBF8F3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PsiEstudio">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  
  <!-- Central Color Palette -->
  <link rel="stylesheet" href="colors.css">

  <!-- Tailwind CSS CDN con configuración custom -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            app: {
              base: 'var(--color-bg-base)',
              surface: 'var(--color-bg-surface)',
              elevated: 'var(--color-bg-elevated)',
              card: 'var(--color-bg-card)',
              modal: 'var(--color-bg-modal)',
              text: 'var(--color-text-main)',
              muted: 'var(--color-text-muted)',
              border: 'var(--color-border-card)',
              emerald: 'var(--color-emerald-main)',
              'emerald-bg': 'var(--color-emerald-bg)',
              navy: 'var(--color-navy-main)',
              'navy-bg': 'var(--color-navy-bg)',
              amber: 'var(--color-amber-main)',
              'amber-bg': 'var(--color-amber-bg)',
              ruby: 'var(--color-ruby-main)',
              'ruby-bg': 'var(--color-ruby-bg)',
            }
          },
          borderRadius: {
            'xl': '20px',
            '2xl': '28px',
            '3xl': '36px'
          },
          boxShadow: {
            'fluffy': 'var(--shadow-fluffy)',
            'card': 'var(--shadow-card)',
            'emerald': 'var(--shadow-emerald)'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX & Mermaid for rich academic notes -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- React 18 + ReactDOM + Babel Standalone + Lucide Icons + Supabase + PDF.js + jsPDF + PDF-Lib + Dexie -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
</head>
<body class="bg-app-base text-app-text min-h-screen antialiased transition-colors duration-300">
  <div id="root"></div>

  <!-- React App Root con Cache Buster -->
  <script type="text/babel" src="app.jsx?v=2.20.0"></script>
</body>
</html>
